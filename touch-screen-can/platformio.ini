[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
extra_scripts = pre:../shared/pio_version.py
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit ILI9341@1.7.0
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
    symlink://../shared/GaugeCan
    symlink://../shared/GaugeDiagnostics
    symlink://../shared/IndexedFramebuffer

[env:listen-only]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D TOUCH_CAN_LISTEN_ONLY=1
